<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>AUTOSTICH — Wartung</title>
  <style>
    :root{
      --bg:#141419; --ink:#e8e8ea; --soft:#b6b3c4; --faint:#8a86a0;
      --lila:#8a7de0; --lila-bright:#b3a8ff; --lila-pale:#e6e1f7; --hair:#2a2a33;
      --mono:"Cascadia Code",Consolas,"SF Mono",ui-monospace,monospace;
      --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    }
    *{box-sizing:border-box;margin:0}
    html,body{height:100%}
    body{
      background:radial-gradient(120% 70% at 50% -5%, rgba(138,125,224,.16), transparent 60%), var(--bg);
      color:var(--ink); font-family:var(--sans);
      min-height:100%; display:flex; align-items:center; justify-content:center;
      padding:32px 20px; -webkit-font-smoothing:antialiased; text-align:center;
    }
    .card{ max-width:560px; display:flex; flex-direction:column; align-items:center; }
    .badge{
      display:inline-flex; align-items:center; gap:9px;
      font-family:var(--mono); font-size:.72rem; letter-spacing:.24em; text-transform:uppercase;
      color:var(--lila-bright); border:1px solid color-mix(in srgb,var(--lila) 45%,var(--hair));
      background:color-mix(in srgb,var(--lila) 12%,transparent);
      border-radius:999px; padding:6px 14px; margin-bottom:30px;
    }
    .badge .dot{ width:7px;height:7px;border-radius:50%; background:var(--lila-bright);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--lila) 30%,transparent);
      animation:pulse 1.9s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{opacity:.5;transform:scale(.85)} 50%{opacity:1;transform:scale(1.2)} }

    /* AUTOSTICH-Wortmarke — animierter Weiß→Lila-Verlauf + Lila-Glow (wie im Spiel, .crt-title / as-title-sweep). */
    .wordmark{
      font-family:var(--mono); font-weight:700;
      font-size:clamp(2.4rem,11vw,4rem); line-height:1; letter-spacing:.04em;
      background:linear-gradient(90deg,#ffffff,var(--lila-pale),var(--lila),var(--lila-bright),var(--lila),var(--lila-pale),#ffffff);
      background-size:200% auto;
      -webkit-background-clip:text; background-clip:text;
      color:transparent; -webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 10px #8a7de0aa);
      animation:as-title-sweep 7s linear infinite;
    }
    .wordmark span{ color:transparent; -webkit-text-fill-color:transparent; }
    @keyframes as-title-sweep{ from{background-position:0% center} to{background-position:200% center} }

    /* Element-Logo (vier Fraktionen um den Stern) — mix-blend screen lässt den dunklen PNG-Hintergrund
       verschwinden, die Elemente glühen; radiale Maske glättet die Kante. Sanftes Schweben + Puls. */
    .logo{
      width:150px; height:150px; object-fit:contain; margin-top:26px;
      mix-blend-mode:screen;
      -webkit-mask-image:radial-gradient(circle,#000 66%,transparent 95%);
      mask-image:radial-gradient(circle,#000 66%,transparent 95%);
      animation:float 5.5s ease-in-out infinite;
      filter:drop-shadow(0 0 16px rgba(138,125,224,.35));
    }
    @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    h1{ font-family:var(--sans); font-weight:700; font-size:clamp(1.3rem,4vw,1.7rem);
      margin:30px 0 10px; color:var(--ink); }
    p{ color:var(--soft); font-size:1.02rem; line-height:1.6; max-width:44ch; }
    .rule{ width:64px; height:2px; margin:28px 0 0;
      background:linear-gradient(90deg,transparent,var(--lila),transparent); opacity:.75; }
    .note{ margin-top:22px; font-family:var(--mono); font-size:.74rem; letter-spacing:.06em; color:var(--faint); }
    @media (prefers-reduced-motion:reduce){ .badge .dot, .wordmark, .logo{animation:none} }
  </style>
</head>
