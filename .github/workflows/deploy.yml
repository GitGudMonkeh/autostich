name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# peaceiris pusht das Build-Ergebnis in den gh-pages-Branch → braucht Schreibrecht.
permissions:
  contents: write

# main- und Testbranch-Deploy teilen sich diese Gruppe, damit nie zwei gleichzeitig
# in gh-pages pushen (Race). Laufende Deploys werden NICHT abgebrochen, sondern eingereiht.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # #250: volle Historie → git rev-list --count HEAD als Build-Nummer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # #250: Build-Stempel (Version) — Commit-Count + kurze SHA + Umgebung in die Env (Vite exponiert VITE_*).
      - name: Build-Metadaten
        run: |
          echo "VITE_BUILD_NUM=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VITE_ENV=main" >> "$GITHUB_ENV"
      - run: npm run build   # base = /autostich/ (Default in vite.config.js)
      - run: npm run gen:db  # #256: Core Game Database aus src/game/* → dist/db/ (unter /autostich/db/)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Root der Pages-Seite. keep_files: den Unterordner test/ (Preview) NICHT mitlöschen.
          keep_files: true
          commit_message: "deploy(main): ${{ github.sha }}"
