name: Deploy to GitHub Pages

# ⚠️ WARTUNGSMODUS (für den rework→main-Merge). Statt des App-Builds wird die statische
# Wartungsseite (maintenance/index.html) in den gh-pages-Root deployt und überschreibt index.html.
# Der Unterordner test/ (und alte Assets) bleibt via keep_files erhalten.
#
# ZUM REAKTIVIEREN der Live-Seite: diesen Commit reverten (`git revert <sha>`) — dann greift wieder
# der App-Build (npm ci/test/build). Der alte Workflow steht in der Git-History dieses Files.
on:
  push:
    branches: [main]
  workflow_dispatch:

# peaceiris pusht das Build-Ergebnis in den gh-pages-Branch → braucht Schreibrecht.
permissions:
  contents: write

# main- und Testbranch-Deploy teilen sich diese Gruppe, damit nie zwei gleichzeitig
# in gh-pages pushen (Race). Laufende Deploys werden NICHT abgebrochen, sondern eingereiht.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wartungsseite als Deploy-Inhalt bereitstellen
        run: |
          mkdir -p dist
          cp maintenance/index.html dist/index.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Root der Pages-Seite. keep_files: den Unterordner test/ (Preview) + alte Assets NICHT mitlöschen.
          keep_files: true
          commit_message: "deploy(main): Wartungsseite ${{ github.sha }}"
