name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# peaceiris pusht das Build-Ergebnis in den gh-pages-Branch → braucht Schreibrecht.
permissions:
  contents: write

# main- und Testbranch-Deploy teilen sich diese Gruppe, damit nie zwei gleichzeitig
# in gh-pages pushen (Race). Laufende Deploys werden NICHT abgebrochen, sondern eingereiht.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # #250: volle Historie → git rev-list --count HEAD als Build-Nummer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # QA-Gate: --max-warnings=0 — ohne Deckel wandert die Warnungszahl nur in eine Richtung.
      - run: npm run lint -- --max-warnings=0
      # #250: Build-Stempel (Version) — Commit-Count + kurze SHA + Umgebung in die Env (Vite exponiert VITE_*).
      - name: Build-Metadaten
        run: |
          echo "VITE_BUILD_NUM=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VITE_ENV=main" >> "$GITHUB_ENV"
      - run: npm run build   # base = /autostich/ (Default in vite.config.js)
      - run: npm run gen:db  # #256: Core Game Database aus src/game/* → dist/db/ (unter /autostich/db/)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Root der Pages-Seite. keep_files MUSS hier true bleiben: ohne destination_dir würde false die
          # Unterordner test/, pixi/, balancing/ UND media/ mitlöschen. Das Prunen übernimmt der Schritt unten.
          keep_files: true
          commit_message: "deploy(main): ${{ github.sha }}"

      # #F-01: Weil der Root-Slot keep_files braucht, sammelten sich hier alle je gebauten gehashten Assets an.
      # Dieser Schritt räumt sie auf — NACH dem Publish, damit es zu keinem Zeitpunkt ein Ausfallfenster gibt:
      # entfernt wird ausschließlich, was im gerade veröffentlichten Build NICHT mehr vorkommt.
      # Die Slot-Ordner und /media/ werden nicht angefasst (nur assets/ wird betrachtet).
      - name: Verwaiste Root-Assets prunen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git worktree add -B gh-pages-prune /tmp/ghp origin/gh-pages
          if [ -d /tmp/ghp/assets ]; then
            removed=0
            for f in /tmp/ghp/assets/*; do
              [ -e "$f" ] || continue
              if [ ! -e "$GITHUB_WORKSPACE/dist/assets/$(basename "$f")" ]; then rm -rf "$f"; removed=$((removed+1)); fi
            done
            echo "Verwaiste Root-Assets entfernt: $removed"
          fi
          cd /tmp/ghp
          git add -A
          if git diff --cached --quiet; then
            echo "Nichts zu prunen."
          else
            git commit -m "chore(pages): verwaiste Root-Assets nach deploy(main) entfernt"
            git push origin HEAD:gh-pages
          fi
