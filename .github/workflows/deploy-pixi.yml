name: Deploy Dev Preview to Pages (/pixi/)

# Deployt den internen Dev-Branch als Unterpfad /autostich/pixi/ auf DIESELBE Pages-Seite wie main.
# Eigener, isolierter Preview-Slot fuer laufende Entwicklungsstaende — hier pruefen wir jeden Schritt live,
# OHNE test/ oder die Hauptseite anzufassen. VITE_PREVIEW="1" -> eigener localStorage-Namespace + kein
# Schreiben ins echte Leaderboard, und die Pixi-Buehne ist aktiv.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

# Gleiche Gruppe wie main/test -> serialisiert die gh-pages-Pushes (kein Race beim Publizieren).
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle Historie -> git rev-list --count HEAD als Build-Nummer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --max-warnings=0
      - name: Build-Metadaten
        run: |
          echo "VITE_BUILD_NUM=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VITE_ENV=pixi" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          DEPLOY_BASE: /autostich/pixi/
          VITE_PREVIEW: "1"
      - run: npm run gen:db
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Branch heisst dev, der bestehende Preview-Slot bleibt bewusst /pixi/.
          destination_dir: pixi
          keep_files: false
          commit_message: "deploy(dev-preview): ${{ github.sha }}"
