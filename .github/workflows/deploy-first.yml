name: Deploy First Version (Archiv) to Pages (/first-version/)

# Deployt die konservierte ERSTE spielbare Version als Unterpfad /autostich/first-version/.
# Reines Erinnerungs-Archiv: Preview-Build, eigener localStorage-Namespace, kein echtes Leaderboard.
on:
  push:
    branches: [archive/first-playable]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DEPLOY_BASE: /autostich/first-version/
          VITE_PREVIEW: "1"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: first-version
          keep_files: true
          commit_message: "deploy(first-version): ${{ github.sha }}"
