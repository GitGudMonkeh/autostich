name: Deploy Media (/media/)

# Musik & andere schwere Medien werden zentral nach /autostich/media/ veröffentlicht.
# Die aktiven App-Stufen sind main, test und dev.
on:
  push:
    branches: [main, test, dev]
    paths:
      - "media/**"
      - ".github/workflows/deploy-media.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Medien-Bestand zeigen
        run: |
          echo "Dateien: $(find media -type f | wc -l)"
          du -sh media
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: media
          destination_dir: media
          keep_files: false
          commit_message: "deploy(media): ${{ github.sha }}"
