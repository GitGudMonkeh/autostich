name: Deploy Exp Playground to Pages (/exp/)

# Deploys the experimental branch `exp` as the sub-path /autostich/exp/ on the SAME Pages site as main,
# test and dev. Its own slot: `exp` is the stripped-down core-loop playground (rounds, offers, balance)
# and never promotes into dev/test/main. VITE_PREVIEW="1" keeps the leaderboard read-only and the preview
# marker on; VITE_STORAGE_NS="exp" gives the slot its own localStorage namespace — /test/ and /pixi/ share
# the `preview_` namespace, and a run saved there under other rules must not show up here as resumable.
on:
  push:
    branches: [exp]
  workflow_dispatch:

permissions:
  contents: write

# Same group as main/test/dev -> serializes the gh-pages pushes (no publishing race).
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history -> git rev-list --count HEAD as build number
      # AGENTS.md — Engineering language: commit messages are English with a conventional prefix. Same check as
      # ci.yml; exp is no longer covered there (it ran every push twice), so the gate lives here as well.
      - name: Commit subject follows the convention
        run: |
          subject="$(git log -1 --format=%s HEAD)"
          case "$subject" in
            Merge\ *|Revert\ *) echo "merge/revert commit, skipped: $subject"; exit 0 ;;
          esac
          if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|test|chore|refactor|ci|perf|build|style)(\([^)]+\))?!?: [A-Za-z]'; then
            echo "::error::Commit subject must be English with a conventional prefix (feat|fix|docs|test|chore|refactor|ci|perf|build|style): \"$subject\" — AGENTS.md, Engineering language"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --max-warnings=0
      # ci.yml used to build the ordinary (non-preview) variant for exp as well; keep that coverage here so a change
      # that only breaks without VITE_PREVIEW is still caught before it is cherry-picked towards dev.
      - name: Build (ordinary variant, not deployed)
        run: npm run build
      - name: Build metadata
        run: |
          echo "VITE_BUILD_NUM=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VITE_ENV=exp" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          DEPLOY_BASE: /autostich/exp/
          VITE_PREVIEW: "1"
          VITE_STORAGE_NS: exp
      - run: npm run gen:db
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: exp
          keep_files: false
          commit_message: "deploy(exp): ${{ github.sha }}"
