name: Deploy Rework-Epic to Pages (/rework/)

# Deployt die Elementar-Rework-Epic-Branch als Unterpfad /autostich/rework/ auf DIESELBE
# Pages-Seite wie main/test. So lässt sich der große Rework live spielen/prüfen, bevor er
# auf Autostich_Test (→ /test/) gemergt wird. Eigene Preview-Page, isoliert von / und /test/.
on:
  push:
    branches: [rework/elemental-live]
  workflow_dispatch:

permissions:
  contents: write

# Gleiche Gruppe wie main/test-Deploy → serialisiert die gh-pages-Pushes (kein Race).
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Assets müssen unter dem Unterpfad aufgelöst werden.
          DEPLOY_BASE: /autostich/rework/
          # Preview-Build: eigener localStorage-Namespace + kein Schreiben ins echte Leaderboard.
          VITE_PREVIEW: "1"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Nur in den Unterordner rework/ schreiben; Root (main) und test/ unangetastet lassen.
          destination_dir: rework
          keep_files: true
          commit_message: "deploy(rework): ${{ github.sha }}"
