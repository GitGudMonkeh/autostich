name: Deploy Balancing to Pages (/balancing/)

# Deployt den balancing-Branch als Unterpfad /autostich/balancing/ auf DIESELBE Pages-Seite wie main.
# Eigener Preview-Slot neben main (/) und Testbranch (/test/) — Balancing-Stände live prüfen, ohne
# die Hauptseite oder den Test-Slot anzufassen.
on:
  push:
    branches: [balancing]
  workflow_dispatch:

permissions:
  contents: write

# Gleiche Gruppe wie main/test → serialisiert die gh-pages-Pushes (kein Race beim Publizieren).
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # #250: volle Historie → git rev-list --count HEAD als Build-Nummer
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # QA-Gate: --max-warnings=0 — ohne Deckel wandert die Warnungszahl nur in eine Richtung.
      - run: npm run lint -- --max-warnings=0
      # #250: Build-Stempel (Version) — Commit-Count + kurze SHA + Umgebung in die Env (Vite exponiert VITE_*).
      - name: Build-Metadaten
        run: |
          echo "VITE_BUILD_NUM=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VITE_ENV=balancing" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          # Assets müssen unter dem Unterpfad aufgelöst werden.
          DEPLOY_BASE: /autostich/balancing/
          # Preview-Build: eigener localStorage-Namespace + kein Schreiben ins echte Leaderboard.
          VITE_PREVIEW: "1"
      - run: npm run gen:db  # #256: Core Game Database aus src/game/* → dist/db/ (unter /autostich/balancing/db/)
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Nur in den Unterordner balancing/ schreiben; Root (main) und test/ unangetastet lassen.
          destination_dir: balancing
          # #F-01: keep_files FALSE — der Slot soll GENAU dem aktuellen Build entsprechen. Mit true blieben alle je
          # gebauten gehashten Dateien für immer liegen (pixi/ trug ~3x so viele Dateien wie ein Build hat).
          # Wirkt nur innerhalb von destination_dir, die anderen Slots und /media/ bleiben unberührt.
          keep_files: false
          commit_message: "deploy(balancing): ${{ github.sha }}"
