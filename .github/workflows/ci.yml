name: CI (Tests · Lint · Build)

# Die dauerhaften Deploy-Branches main, test und dev fahren ihre Qualitaetschecks bereits in den
# jeweiligen Deploy-Workflows. Auf allen anderen Branches stellt dieser Workflow dieselben Gates
# sicher, ohne irgendetwas zu deployen.
on:
  push:
    branches-ignore: [main, test, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
      - name: Build (Preview-Slot-Variante)
        run: npm run build
        env:
          DEPLOY_BASE: /autostich/ci/
          VITE_PREVIEW: "1"
      - run: npm run gen:db
