name: Deploy Testbranch to Pages (/test/)

# Deployt den Testbranch als Unterpfad /autostich/test/ auf DIESELBE Pages-Seite wie main.
# So lassen sich große Features live prüfen, ohne die Hauptseite anzufassen.
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint -- --max-warnings=0
      - name: Build-Metadaten
        run: |
          echo "VITE_BUILD_NUM=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "VITE_ENV=test" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          DEPLOY_BASE: /autostich/test/
          VITE_PREVIEW: "1"
      - run: npm run gen:db
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          destination_dir: test
          keep_files: false
          commit_message: "deploy(test): ${{ github.sha }}"
