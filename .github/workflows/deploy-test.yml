name: Deploy Testbranch to Pages (/test/)

# ⚠️ WARTUNGSMODUS (vorbereitet für den späteren rework→main-Merge).
# Statt des App-Builds wird die statische Wartungsseite (maintenance/index.html) nach
# /autostich/test/ deployt und überschreibt dort index.html. Root (main-Seite) bleibt unangetastet.
#
# ZUM REAKTIVIEREN der Testseite: diesen Commit reverten (`git revert <sha>`) — dann greift wieder
# der App-Build (npm ci/test/build mit DEPLOY_BASE=/autostich/test/ + VITE_PREVIEW=1). Der alte
# Workflow steht dafür in der Git-History dieses Files.
on:
  push:
    branches: [Autostich_Test]
  workflow_dispatch:

permissions:
  contents: write

# Gleiche Gruppe wie der main-Deploy → serialisiert die gh-pages-Pushes (kein Race).
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wartungsseite als Deploy-Inhalt bereitstellen
        run: |
          mkdir -p dist
          cp maintenance/index.html dist/index.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          # Nur in den Unterordner test/ schreiben; Root (main-Seite) unangetastet lassen.
          # keep_files: true → alte App-Assets bleiben liegen (die Wartungsseite ist self-contained
          # und referenziert sie nicht), aber index.html wird durch die Wartungsseite ersetzt.
          destination_dir: test
          keep_files: true
          commit_message: "deploy(test): Wartungsseite ${{ github.sha }}"
